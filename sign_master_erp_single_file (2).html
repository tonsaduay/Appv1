        materialCostPerSqm: 120,
        inkCostPerSqm: 45,
        electricityPerSqm: 25,
        hiddenLaborPerSqm: 85,
        wastePercent: 12,
      });

      const estimatorCalc = useMemo(() => {
        const wM = (parseFloat(newJob.widthCm) || 0) / 100;
        const hM = (parseFloat(newJob.heightCm) || 0) / 100;
        const hCm = parseFloat(newJob.heightCm) || 0;
        const qty = Math.max(1, parseInt(newJob.qty) || 1);
        const unitPrice = parseFloat(newJob.unitPrice) || 0;

        const areaPerPiece = wM * hM;
        const totalArea = areaPerPiece * qty;

        let sellingPrice = 0;
        if (newJob.pricingMode === 'area') {
          sellingPrice = totalArea * unitPrice;
        } else if (newJob.pricingMode === 'height') {
          sellingPrice = hCm * qty * unitPrice;
        } else {
          sellingPrice = unitPrice * qty;
        }

        // Break-even calculation based on area & waste %
        const effectiveArea = Math.max(0.5, totalArea) * (1 + (costParams.wastePercent / 100));
        const unitOverhead =
          costParams.materialCostPerSqm +
          costParams.inkCostPerSqm +
          costParams.electricityPerSqm +
          costParams.hiddenLaborPerSqm;

        const breakEvenFloor = effectiveArea * unitOverhead;
        const netProfit = sellingPrice - breakEvenFloor;
        const netMarginPct = sellingPrice > 0 ? (netProfit / sellingPrice) * 100 : 0;

        return {
          totalArea,
          sellingPrice,
          breakEvenFloor,
          netProfit,
          netMarginPct,
          isBelowBreakEven: sellingPrice < breakEvenFloor
        };
      }, [newJob, costParams]);

        e.dataTransfer.setData('text/plain', jobId);
      };

        e.preventDefault();
        if (dragOverStage !== stageId) {
          setDragOverStage(stageId);
        }
      };

      const handleDrop = (e, targetStageId) => {
        e.preventDefault();
        setDragOverStage(null);
        if (!currentUser?.canEditJobs) {
          notify('คุณไม่มีสิทธิ์ย้ายสถานะใบงาน', 'error');
          return;
        }
        const jobId = e.dataTransfer.getData('text/plain') || draggedJobId;
        if (!jobId) return;

        setJobs(prev => prev.map(j => j.id === jobId ? { ...j, stage: targetStageId } : j));
        setDraggedJobId(null);
        notify(`อัปเดตสถานะใบงาน ${jobId} เรียบร้อยแล้ว`);
      };

      const updateJobDetails = (updatedJob) => {
        setJobs(prev => prev.map(j => j.id === updatedJob.id ? updatedJob : j));
        setSelectedKanbanJob(null);
        notify(`บันทึกข้อมูลและผลตรวจ QC ของ ${updatedJob.id} แล้ว`);
      };

      // =========================================================================
      // TAB 4: ARTWORK PROOFING
      // =========================================================================
      const handleApproveArtwork = (jobId) => {
        if (!currentUser?.canEditJobs) {
          notify('คุณไม่มีสิทธิ์อนุมัติแบบผลิต', 'error');
          return;
        }
        const nowStr = new Date().toLocaleString('th-TH', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        });
        setJobs(prev => prev.map(j => {
          if (j.id === jobId) {
            return {
              ...j,
              artworkApproved: true,
              artworkApprovedAt: nowStr,
              stage: j.stage === 'design' ? 'producing' : j.stage
            };
          }
          return j;
        }));
        notify(`ยืนยันอนุมัติแบบผลิต ${jobId} แล้ว! ย้ายเข้าคิวผลิตอัตโนมัติ`);
      };

      // =========================================================================
      // TAB 5: INSTALLATION & GPS CHECK-IN
      // =========================================================================
      const handleCompleteInstallation = (jobId) => {
        if (!currentUser?.canEditJobs) {
          notify('คุณไม่มีสิทธิ์ปิดงานติดตั้ง', 'error');
          return;
        }
        setJobs(prev => prev.map(j => {
          if (j.id === jobId) {
            return {
              ...j,
              installStatus: 'completed',
              stage: 'completed'
            };
          }
          return j;
        }));
        notify(`เช็คอินหน้างานและปิดงานติดตั้ง ${jobId} เรียบร้อย!`);
      };

      // =========================================================================
      // TAB 6: INVENTORY & MACHINE LOGS
      // =========================================================================
      const [newMachineLog, setNewMachineLog] = useState({
        machine: 'เครื่องพิมพ์อิงค์เจ็ท Mimaki JV300-160',
        task: '',
        status: 'ปกติพร้อมใช้งาน'
      });

      const handleAdjustStock = (invId, delta) => {
        if (!currentUser?.canManageInventory) {
          notify('เฉพาะผู้ที่มีสิทธิ์จัดการคลังวัสดุเท่านั้น', 'error');
          return;
        }
        setInventory(prev => prev.map(item => {
          if (item.id === invId) {
            const nextStock = Math.max(0, item.stock + delta);
            return { ...item, stock: nextStock };
          }
          return item;
        }));
        notify(`อัปเดตยอดสต็อกวัสดุเรียบร้อย`);
      };

      const handleAddMachineLog = (e) => {
        e.preventDefault();
        if (!newMachineLog.task.trim()) return;
        const entry = {
          id: `MCH-${Date.now()}`,
          machine: newMachineLog.machine,
          task: newMachineLog.task,
          status: newMachineLog.status,
          date: new Date().toISOString().split('T')[0],
          technician: currentUser.name
        };
        setMachineLogs([entry, ...machineLogs]);
        setNewMachineLog({ ...newMachineLog, task: '' });
        notify('บันทึกประวัติการบำรุงรักษาเครื่องจักรแล้ว');
      };

      // =========================================================================
      // TAB 7: DOCUMENTS & TAX ENGINE (A4 PRINTABLE)
      // =========================================================================
      const [selectedDocJobId, setSelectedDocJobId] = useState(INITIAL_JOBS[0].id);
      const [docType, setDocType] = useState('quotation'); // 'work_order' | 'quotation' | 'invoice' | 'tax_invoice' | 'deposit' | 'qr_ticket'
      const [includeVat, setIncludeVat] = useState(true);
      const [includeWht, setIncludeWht] = useState(false);

      const selectedDocJob = useMemo(() => {
        return jobs.find(j => j.id === selectedDocJobId) || jobs[0];
      }, [jobs, selectedDocJobId]);

      const docFinancials = useMemo(() => {
        if (!selectedDocJob) return { subtotal: 0, vat: 0, wht: 0, grandTotal: 0, netPayable: 0 };
        const baseAmount = docType === 'deposit'
          ? (selectedDocJob.depositPaid || Math.round(selectedDocJob.totalPrice * 0.5))
          : selectedDocJob.totalPrice;

        const vat = includeVat ? baseAmount * 0.07 : 0;
        const grandTotal = baseAmount + vat;
        const wht = includeWht ? baseAmount * 0.03 : 0;
        const netPayable = grandTotal - wht;

        return { subtotal: baseAmount, vat, grandTotal, wht, netPayable };
      }, [selectedDocJob, docType, includeVat, includeWht]);

      const openJobDocument = (jobId, type = 'quotation') => {
        setSelectedDocJobId(jobId);
        setDocType(type);
        setActiveTab('documents');
      };

      // =========================================================================
      // TAB 8: STAFF & RBAC PERMISSIONS
      // =========================================================================
      const [showAddStaffModal, setShowAddStaffModal] = useState(false);
      const [newStaffForm, setNewStaffForm] = useState({
        name: '',
        role: 'Sales & Design',
        pin: '',
        department: 'ขาย & ออกแบบ',
        canViewPrices: true,
        canEditJobs: true,
        canManageInventory: false,
      });

      const handleTogglePermission = (staffId, field) => {
        if (currentUser?.role !== 'Admin Master') {
          notify('เฉพาะ Admin Master เท่านั้นที่แก้ไขสิทธิ์พนักงานได้', 'error');
          return;
        }
        setStaffList(prev => prev.map(stf => {
          if (stf.id === staffId) {
            return { ...stf, [field]: !stf[field] };
          }
          return stf;
        }));
        notify('อัปเดตสิทธิ์การเข้าถึงเรียบร้อย');
      };

      const handleCreateStaff = (e) => {
        e.preventDefault();
        if (!newStaffForm.name.trim() || newStaffForm.pin.length !== 4) {
          notify('กรุณากรอกชื่อพนักงานและรหัส PIN 4 หลัก', 'error');
          return;
        }
        if (staffList.some(s => s.pin === newStaffForm.pin)) {
          notify('รหัส PIN นี้ถูกใช้งานแล้ว กรุณาใช้รหัสอื่น', 'error');
          return;
        }
        const created = {
          ...newStaffForm,
          id: `STF-${String(staffList.length + 1).padStart(3, '0')}`
        };
        setStaffList([...staffList, created]);
        setShowAddStaffModal(false);
        setNewStaffForm({
          name: '', role: 'Sales & Design', pin: '', department: 'ขาย & ออกแบบ',
          canViewPrices: true, canEditJobs: true, canManageInventory: false
        });
        notify(`เพิ่มพนักงาน ${created.name} เข้าระบบแล้ว`);
      };

      // =========================================================================
      // LOGIN HANDLERS
      // =========================================================================
      const handleLoginWithPin = (pinToVerify) => {
        const found = staffList.find(s => s.pin === pinToVerify);
        if (found) {
          setCurrentUser(found);
          setPinInput('');
          setLoginError('');
          notify(`ยินดีต้อนรับ ${found.name} (${found.role})`);
        } else {
          setLoginError('รหัส PIN ไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
        }
      };

      const handlePinDigit = (digit) => {
        if (pinInput.length < 4) {
          const next = pinInput + digit;
          setPinInput(next);
          if (next.length === 4) {
            handleLoginWithPin(next);
          }
        }
      };

      // =========================================================================
      // CLOUD BACKUP EXPORT / IMPORT
      // =========================================================================
      const handleExportJson = () => {
        const backupData = {
          exportedAt: new Date().toISOString(),
          shopInfo,
          staffList,
          jobs,
          inventory,
          machineLogs
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SIGNMASTER-BACKUP-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        notify('ดาวน์โหลดไฟล์สำรองข้อมูล JSON เรียบร้อยแล้ว');
      };

      const handleImportJson = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed.jobs) setJobs(parsed.jobs);
            if (parsed.inventory) setInventory(parsed.inventory);
            if (parsed.staffList) setStaffList(parsed.staffList);
            if (parsed.shopInfo) setShopInfo(parsed.shopInfo);
            if (parsed.machineLogs) setMachineLogs(parsed.machineLogs);
            notify('กู้คืนข้อมูลจากไฟล์สำรองสำเร็จ!');
            setShowCloudModal(false);
          } catch (err) {
            notify('ไฟล์สำรองข้อมูลไม่ถูกต้อง', 'error');
          }
        };
        reader.readAsText(file);
      };

      const handleTriggerCloudWebhook = async () => {
        if (!shopInfo.webhookUrl) {
          notify('บันทึกการตั้งค่าแล้ว (หากต้องการซิงค์อัตโนมัติ กรุณาระบุ Webhook URL)');
          setShowCloudModal(false);
          return;
        }
        setCloudSyncStatus('syncing');
        try {
          await fetch(shopInfo.webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ timestamp: new Date().toISOString(), jobs, inventory })
          });
          setCloudSyncStatus('synced');
          notify('ซิงค์ข้อมูลขึ้น Cloud Webhook สำเร็จ!');
        } catch (err) {
          setCloudSyncStatus('offline');
          notify('ไม่สามารถเชื่อมต่อ Webhook ได้ แต่ข้อมูลถูกบันทึกในเครื่องแล้ว', 'error');
        }
        setShowCloudModal(false);
      };

      // =========================================================================
      // KPI METRICS COMPUTATION
      // =========================================================================
      const kpiMetrics = useMemo(() => {
        const totalRevenue = jobs.reduce((acc, j) => acc + (j.totalPrice || 0), 0);
        const totalCost = jobs.reduce((acc, j) => acc + (j.estimatedCost || 0), 0);
        const netProfit = totalRevenue - totalCost;
        const activeJobsCount = jobs.filter(j => j.stage !== 'completed').length;
        const completedJobsCount = jobs.filter(j => j.stage === 'completed').length;
        const lowStockCount = inventory.filter(i => i.stock <= i.minStock).length;

        return {
          totalRevenue,
          netProfit,
          activeJobsCount,
          completedJobsCount,
          lowStockCount
        };
      }, [jobs, inventory]);

      // =========================================================================
      // RENDER: LOGIN SCREEN
      // =========================================================================
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 relative overflow-hidden">
            {/* Ambient Background Glow */}
            <div className="absolute -top-32 -left-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div className="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl z-10">
              {/* Brand Header */}
              <div className="text-center mb-6">
                <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-600 text-slate-950 font-bold text-2xl shadow-lg shadow-amber-500/20 mb-3">
                  SM
                </div>
                <h1 className="text-2xl font-bold tracking-tight text-white">
                  SIGN-MASTER <span className="text-amber-400">ERP PRO</span>
                </h1>
                <p className="text-slate-400 text-sm mt-1">ระบบบริหารจัดการร้านป้ายโฆษณาครบวงจร</p>
              </div>

              {/* PIN Display Dots */}
              <div className="mb-6">
                <label className="block text-center text-xs uppercase tracking-wider text-slate-400 mb-3">
                  กรุณากรอกรหัส PIN 4 หลักเพื่อเข้าสู่ระบบ
                </label>
                <div className="flex justify-center gap-4">
                  {[0, 1, 2, 3].map(idx => (
                    <div
                      key={idx}
                      className={`w-12 h-14 rounded-xl border-2 flex items-center justify-center text-2xl font-bold transition-all ${
                        pinInput.length > idx
                          ? 'border-amber-400 bg-amber-400/10 text-amber-400'
                          : 'border-slate-700 bg-slate-800/60 text-slate-600'
                      }`}
                    >
                      {pinInput.length > idx ? '●' : ''}
                    </div>
                  ))}
                </div>
                {loginError && (
                  <p className="text-rose-400 text-xs text-center mt-3 font-medium">{loginError}</p>
                )}
              </div>

              {/* Numeric Keypad */}
              <div className="grid grid-cols-3 gap-2.5 mb-6">
                {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(num => (
                  <button
                    key={num}
                    onClick={() => handlePinDigit(num)}
                    className="py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-white text-xl font-semibold transition border border-slate-700/60"
                  >
                    {num}
                  </button>
                ))}
                <button
                  onClick={() => { setPinInput(''); setLoginError(''); }}
                  className="py-3.5 rounded-xl bg-slate-800/60 hover:bg-rose-500/20 text-rose-400 text-sm font-medium transition border border-slate-700/60"
                >
                  ล้างรหัส
                </button>
                <button
                  onClick={() => handlePinDigit('0')}
                  className="py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-white text-xl font-semibold transition border border-slate-700/60"
                >
                  0
                </button>
                <button
                  onClick={() => setPinInput(prev => prev.slice(0, -1))}
                  className="py-3.5 rounded-xl bg-slate-800/60 hover:bg-slate-700 text-slate-300 text-sm font-medium transition border border-slate-700/60"
                >
                  ⌫ ลบ
                </button>
              </div>

              {/* Quick Demo Login Buttons */}
              <div className="border-t border-slate-800 pt-5">
                <p className="text-xs text-slate-400 text-center mb-3 font-medium">
                  ⚡ ปุ่มทดลองเข้าใช้งานด่วน (1-Click Demo Login)
                </p>
                <div className="space-y-2">
                  <button
                    onClick={() => handleLoginWithPin('9999')}
                    className="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/40 text-left transition group"
                  >
                    <div>
                      <div className="text-sm font-semibold text-amber-300 group-hover:text-amber-200">
                        👑 Admin Master (เจ้าของร้าน)
                      </div>
                      <div className="text-[11px] text-slate-400">เห็นต้นทุน/กำไร • จัดการคลัง • ตั้งค่าสิทธิ์</div>
                    </div>
                    <span className="px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 font-bold text-xs">
                      PIN: 9999
                    </span>
                  </button>

                  <button
                    onClick={() => handleLoginWithPin('1111')}
                    className="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/40 text-left transition group"
                  >
                    <div>
                      <div className="text-sm font-semibold text-sky-300 group-hover:text-sky-200">
                        💼 ฝ่ายขาย & กราฟิก (Sales Staff)
                      </div>
                      <div className="text-[11px] text-slate-400">รับงาน/คิดราคา • ออกบิล • ห้ามแก้สต็อกคลัง</div>
                    </div>
                    <span className="px-2.5 py-1 rounded-lg bg-sky-500 text-slate-950 font-bold text-xs">
                      PIN: 1111
                    </span>
                  </button>

                  <button
                    onClick={() => handleLoginWithPin('2222')}
                    className="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 text-left transition group"
                  >
                    <div>
                      <div className="text-sm font-semibold text-emerald-300 group-hover:text-emerald-200">
                        🛠️ ช่างผลิต & ทีมติดตั้ง (Production)
                      </div>
                      <div className="text-[11px] text-slate-400">ซ่อนตัวเลขราคา/กำไร • อัปเดต Kanban & GPS</div>
                    </div>
                    <span className="px-2.5 py-1 rounded-lg bg-emerald-500 text-slate-950 font-bold text-xs">
                      PIN: 2222
                    </span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // =========================================================================
      // RENDER: MAIN ERP WORKSPACE
      // =========================================================================
      const navItems = [
        { id: 'dashboard', label: 'แดชบอร์ด & กำไร', icon: '📊' },
        { id: 'estimator', label: 'รับงาน & คำนวณราคา', icon: '🧮' },
        { id: 'kanban', label: 'ติดตามงาน Kanban', icon: '📋' },
        { id: 'proofing', label: 'ตรวจอนุมัติแบบ', icon: '🎨' },
        { id: 'installation', label: 'ทีมติดตั้ง & GPS', icon: '🚚' },
        { id: 'inventory', label: 'คลังวัสดุ & เครื่องจักร', icon: '📦' },
        { id: 'documents', label: 'เอกสาร & ใบกำกับภาษี', icon: '🧾' },
        { id: 'staff', label: 'ทีมงาน & สิทธิ์ผู้ใช้', icon: '🔐' },

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 no-print animate-bounce">
              <div className={`px-4 py-3 rounded-2xl shadow-2xl border flex items-center gap-3 text-sm font-medium ${
                toastMsg.type === 'error'
                  ? 'bg-rose-950/95 border-rose-500 text-rose-200'
                  : 'bg-emerald-950/95 border-emerald-500 text-emerald-200'
              }`}>
                <span>{toastMsg.type === 'error' ? '⚠️' : '✅'}</span>
                <span>{toastMsg.message}</span>
              </div>
            </div>
          )}

          {/* TOP HEADER */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 no-print">
            <div className="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              {/* Left Brand */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 text-slate-950 font-extrabold flex items-center justify-center text-lg shadow">
                  SM
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-white tracking-tight text-base sm:text-lg">
                      SIGN-MASTER <span className="text-amber-400">ERP PRO</span>
                    </span>
                    <span className="hidden md:inline-block px-2 py-0.5 text-[11px] rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                      {shopInfo.name}
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">ระบบบริหารจัดการโรงงานผลิตป้ายโฆษณาและงานติดตั้ง</p>
                </div>
              </div>

              {/* Right Controls: User Badge, Cloud Sync, Logout */}
              <div className="flex items-center gap-2 sm:gap-3">
                {/* Active Role Badge */}
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700">
                  <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                  <div className="text-xs">
                    <div className="font-semibold text-white">{currentUser.name}</div>
                    <div className="text-[10px] text-amber-400">{currentUser.role}</div>
                  </div>
                </div>

                {/* Cloud Sync Button */}
                <button
                  onClick={() => setShowCloudModal(true)}
                  className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-slate-200 flex items-center gap-1.5 transition"
                  title="สำรองข้อมูลและซิงค์ Cloud"
                >
                  <span className={`w-2 h-2 rounded-full ${cloudSyncStatus === 'synced' ? 'bg-sky-400' : 'bg-amber-400'}`}></span>
                  <span className="hidden sm:inline">Cloud & Backup</span>
                  <span>☁️</span>
                </button>

                {/* Logout Button */}
                <button
                  onClick={() => setCurrentUser(null)}
                  className="px-3 py-2 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/40 text-rose-300 text-xs font-semibold transition"
                >
                  ออกจากระบบ
                </button>
              </div>
            </div>

            {/* NAVIGATION TABS */}
            <nav className="bg-slate-900/80 border-t border-slate-800/80 overflow-x-auto">
              <div className="max-w-[1600px] mx-auto px-4 flex items-center gap-1 py-1.5">
                {navItems.map(tab => {
                  const isActive = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap flex items-center gap-2 transition ${
                        isActive
                          ? 'bg-amber-500 text-slate-950 font-semibold shadow-lg shadow-amber-500/20'
                          : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                      }`}
                    >
                      <span>{tab.icon}</span>

                              >
                                {stf.canManageInventory ? '✓ อนุญาต' : '✕ ห้ามแก้ไข'}
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Add Staff Modal */}
                {showAddStaffModal && (
                  <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <form onSubmit={handleCreateStaff} className="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-6 space-y-4">
                      <h3 className="text-base font-bold text-white">+ เพิ่มบัญชีพนักงานใหม่</h3>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">ชื่อ-นามสกุล พนักงาน</label>
                        <input
                          type="text"
                          required
                          value={newStaffForm.name}
                          onChange={e => setNewStaffForm({ ...newStaffForm, name: e.target.value })}
                          className="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">รหัส PIN 4 หลัก</label>
                          <input
                            type="text"
                            maxLength="4"
                            required
                            placeholder="เช่น 3333"
                            value={newStaffForm.pin}
                            onChange={e => setNewStaffForm({ ...newStaffForm, pin: e.target.value.replace(/\D/g, '') })}
                            className="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white font-mono"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">ตำแหน่ง</label>
                          <select
                            value={newStaffForm.role}
                            onChange={e => setNewStaffForm({ ...newStaffForm, role: e.target.value })}
                            className="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white"
                          >
                            <option value="Sales & Design">Sales & Design</option>
                            <option value="Production & Installer">Production & Installer</option>
                            <option value="Admin Master">Admin Master</option>
                          </select>
                        </div>
                      </div>
                      <div className="flex justify-end gap-2 pt-3">
                        <button
                          type="button"
                          onClick={() => setShowAddStaffModal(false)}
                          className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs"
                        >
                          ยกเลิก
                        </button>
                        <button
                          type="submit"
                          className="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs"
                        >
                          บันทึกพนักงาน
                        </button>
                      </div>
                    </form>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* ================================================================= */}
          {/* CLOUD SYNC & JSON BACKUP MODAL                                    */}
          {/* ================================================================= */}
          {showCloudModal && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white">☁️ สำรองข้อมูล & ซิงค์คลาวด์ (Backup)</h3>
                  <button onClick={() => setShowCloudModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Google Apps Script / Cloud Webhook URL (ถ้ามี)</label>
                    <input
                      type="url"
                      placeholder="https://script.google.com/macros/s/..."
                      value={shopInfo.webhookUrl}
                      onChange={e => setShopInfo({ ...shopInfo, webhookUrl: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white"
                    />
                  </div>

                  <button
                    onClick={handleTriggerCloudWebhook}
                    className="w-full py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs transition"
                  >
                    🔄 บันทึกการตั้งค่า & ซิงค์ข้อมูลเดี๋ยวนี้
                  </button>
                </div>

                <div className="border-t border-slate-800 pt-4 space-y-2.5">
                  <div className="text-xs font-semibold text-slate-300">สำรองข้อมูลลงเครื่องคอมพิวเตอร์ (Offline JSON)</div>
                  <div className="grid grid-cols-2 gap-2.5">
                    <button
                      onClick={handleExportJson}
                      className="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-amber-300 font-semibold transition"
                    >
                      ⬇️ Export ไฟล์ .JSON
                    </button>
                    <label className="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-emerald-300 font-semibold text-center cursor-pointer transition">
                      ⬆️ Import กู้คืนข้อมูล
                      <input type="file" accept=".json" onChange={handleImportJson} className="hidden" />
                    </label>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
